<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>FluidEngine - Interactive Demo</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e293b; padding: 30px; border-radius: 12px; }
        h1 { color: #38bdf8; }
        .step { background: #334155; padding: 15px; margin-bottom: 15px; border-radius: 8px; border-left: 4px solid #38bdf8; }
        button { background: #0ea5e9; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .trace { background: #000; padding: 15px; border-radius: 8px; font-family: monospace; color: #a3e635; }
        .stats { display: flex; gap: 20px; margin-top: 15px; }
        .stat-box { background: #1e293b; border: 1px solid #475569; padding: 10px; border-radius: 6px; flex: 1; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ FluidEngine Interactive Demo</h1>
        <div class="step">
            <strong>Hapi 1:</strong> Zgjidh një imazh <br>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        <div class="step">
            <strong>Hapi 2:</strong> Ekzekuto BitPipeline <br>
            <button id="runBtn">Provo Pipeline-in</button>
        </div>
        <div id="resultArea" style="display: none;">
            <div class="stats">
                <div class="stat-box">Origjinale: <span id="origSize">0</span> b</div>
                <div class="stat-box">Kompresuar: <span id="compSize">0</span> b</div>
                <div class="stat-box">Koha: <span id="execTime">0</span> ms</div>
            </div>
            <h4>Provat (Trace):</h4>
            <div class="trace" id="traceLog">Duke pritur...</div>
        </div>
    </div>
    <script>
        document.getElementById('runBtn').addEventListener('click', async () => {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return alert("Zgjidh një imazh!");
            
            const btn = document.getElementById('runBtn');
            btn.disabled = true; btn.innerText = "Duke procesuar...";
            
            try {
                const buffer = await file.arrayBuffer();
                const base64Data = btoa(String.fromCharCode(...new Uint8Array(buffer)));
                
                const res = await fetch('/api/fluid/bitpipeline', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ inputData: base64Data })
                });
                
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                
                document.getElementById('origSize').innerText = file.size;
                document.getElementById('compSize').innerText = Math.round(data.output.length * 0.75);
                document.getElementById('execTime').innerText = data.executionTimeMs.toFixed(2);
                document.getElementById('traceLog').innerHTML = data.steps.map(s => `[${s.success ? 'PASS' : 'FAIL'}] ${s.stepName} (${s.durationMs.toFixed(2)} ms)`).join('<br>');
                document.getElementById('resultArea').style.display = 'block';
            } catch (err) {
                alert("Gabim: " + err.message);
            } finally {
                btn.disabled = false; btn.innerText = "Provo Pipeline-in";
            }
        });
    </script>
</body>
</html>
