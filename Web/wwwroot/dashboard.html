<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lightning SPP Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg2: #1e293b;
      --card: #111827;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --accent2: #f59e0b;
      --ok: #10b981;
      --err: #ef4444;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 15% 20%, #164e63, var(--bg)), linear-gradient(120deg, var(--bg), var(--bg2));
      min-height: 100vh;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px; letter-spacing: 0.3px; }
    p { color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .card {
      background: color-mix(in srgb, var(--card) 88%, transparent);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 26px rgba(0,0,0,0.25);
    }
    label { display:block; margin: 10px 0 4px; color: var(--muted); font-size: 14px; }
    input, select, button {
      width: 100%; box-sizing: border-box; border-radius: 10px;
      border: 1px solid #334155; padding: 10px; background: #0b1220; color: var(--text);
    }
    button {
      margin-top: 12px; cursor: pointer; background: linear-gradient(120deg, #0891b2, #06b6d4);
      border: none; font-weight: 600; color: #06202a;
    }
    .row { display:flex; gap:10px; }
    .flex-1 { flex: 1; }
    .pill { display:inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; background: #1f2937; border: 1px solid #374151; }
    .status-ok { color: var(--ok); }
    .status-err { color: var(--err); }
    code { background:#020617; border:1px solid #334155; padding:2px 6px; border-radius:8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Lightning SPP License Dashboard</h1>
    <p>Menaxhim i licencave, gjenerim keys dhe aktivizim nga web UI.</p>

    <div class="grid">
      <section class="card">
        <h2>Status</h2>
        <p id="status">Duke ngarkuar...</p>
        <button onclick="refreshStatus()">Refresh Status</button>
      </section>

      <section class="card">
        <h2>Metrics</h2>
        <p id="metrics">Duke ngarkuar...</p>
        <button onclick="refreshMetrics()">Refresh Metrics</button>
      </section>

      <section class="card">
        <h2>Alerts & Schema</h2>
        <p id="alerts">Duke ngarkuar alerts...</p>
        <p id="schemaVersion">Duke ngarkuar schema...</p>
        <p id="signingStatus">Signing status: n/a</p>
        <button onclick="refreshAlertsAndSchema()">Refresh Alerts/Schema</button>
      </section>

      <section class="card">
        <h2>Krijo Key</h2>
        <label for="email">Email</label>
        <input id="email" type="email" />

        <label for="company">Company</label>
        <input id="company"  />

        <label for="adminToken">Admin Token (Bearer)</label>
        <input id="adminToken" type="password" autocomplete="off" placeholder="LSPP_ADMIN_TOKEN" />

        <div class="row">
          <div class="flex-1">
            <label for="tier">Tier</label>
            <select id="tier">
              <option value="free">free</option>
              <option value="paygo">paygo</option>
              <option value="unlimited" selected>unlimited</option>
              <option value="enterprise">enterprise</option>
            </select>
          </div>
          <div class="flex-1">
            <label for="payment">Provisioning</label>
            <select id="payment">
              <option value="manual" selected>Manual administrator grant (no payment)</option>
            </select>
          </div>
        </div>

        <button onclick="issueKey()">Issue Key</button>
        <p id="newKey"></p>
      </section>

      <section class="card">
        <h2>Aktivizo Key</h2>
        <label for="licenseKey">License key</label>
        <input id="licenseKey" placeholder="Signed license key" />
        <button onclick="activateKey()">Activate</button>
        <p id="activation"></p>
      </section>
    </div>
  </div>

  <script>
    function parseKeyValue(text) {
      const obj = {};
      for (const line of text.split('\n')) {
        const idx = line.indexOf('=');
        if (idx <= 0) continue;
        const k = line.slice(0, idx).trim();
        const v = line.slice(idx + 1).trim();
        obj[k] = v;
      }
      return obj;
    }

    function toForm(payload) {
      const form = new URLSearchParams();
      for (const [k, v] of Object.entries(payload)) {
        form.append(k, String(v));
      }
      return form;
    }

    async function refreshStatus() {
      const el = document.getElementById('status');
      try {
        const res = await fetch('/api/license/status');
        const text = await res.text();
        const data = parseKeyValue(text);
        const valid = data.valid === 'true';
        const cls = valid ? 'status-ok' : 'status-err';
        el.innerHTML = `HasLicense: <span class="${cls}">${data.hasLicense}</span><br/>Tier: <span class="pill">${data.tier}</span><br/>Valid: <span class="${cls}">${data.valid}</span><br/>Usage: ${data.usageThisMonth}`;
      } catch (e) {
        el.innerHTML = '<span class="status-err">API unavailable</span>';
      }
    }

    async function refreshMetrics() {
      const el = document.getElementById('metrics');
      try {
        const res = await fetch('/api/metrics');
        const text = await res.text();
        const data = parseKeyValue(text);
        el.innerHTML =
          `Pipelines: ${data.pipelineRequests || 0}<br/>` +
          `Success: <span class="status-ok">${data.pipelineSuccess || 0}</span> / ` +
          `Failure: <span class="status-err">${data.pipelineFailure || 0}</span><br/>` +
          `Scan avg: ${data.scanAvgMs || 0} ms<br/>` +
          `Process avg: ${data.processAvgMs || 0} ms<br/>` +
          `Print avg: ${data.printAvgMs || 0} ms`;
      } catch {
        el.innerHTML = '<span class="status-err">Metrics unavailable</span>';
      }
    }

    async function refreshAlertsAndSchema() {
      const alertsEl = document.getElementById('alerts');
      const schemaEl = document.getElementById('schemaVersion');
      const signingEl = document.getElementById('signingStatus');

      try {
        const aRes = await fetch('/api/alerts');
        const aText = await aRes.text();
        const aData = parseKeyValue(aText);
        const active = aData.alertsActive === 'true';
        alertsEl.innerHTML = active
          ? `<span class="status-err">Alerts active: ${aData.alertsCount || 0}</span>`
          : `<span class="status-ok">No active alerts</span>`;
      } catch {
        alertsEl.innerHTML = '<span class="status-err">Alerts unavailable</span>';
      }

      try {
        const sRes = await fetch('/api/stigma/schema');
        const schema = await sRes.json();
        schemaEl.innerHTML = `Schema: <span class="pill">${schema.version || 'n/a'}</span>`;
      } catch {
        schemaEl.innerHTML = '<span class="status-err">Schema unavailable</span>';
      }

      try {
        const r = await fetch('/api/license/signing-status', {
          headers: {
            'Authorization': `Bearer ${document.getElementById('adminToken').value || ''}`
          }
        });
        const text = await r.text();
        const data = parseKeyValue(text);
        if (r.ok) {
          signingEl.innerHTML = `Active KID: <span class="pill">${data.activeKid || 'n/a'}</span><br/>Loaded: ${data.loadedKids || 'n/a'}`;
        } else {
          signingEl.innerHTML = '<span class="status-err">Signing status unauthorized</span>';
        }
      } catch {
        signingEl.innerHTML = '<span class="status-err">Signing status unavailable</span>';
      }
    }

    async function issueKey() {
      const payload = {
        email: document.getElementById('email').value,
        company: document.getElementById('company').value,
        tier: document.getElementById('tier').value,
        useInternalQuantumSecurity: document.getElementById('payment').value === 'internal'
      };

      const res = await fetch('/api/license/issue', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
          'Authorization': `Bearer ${document.getElementById('adminToken').value || ''}`
        },
        body: toForm(payload)
      });
      const data = parseKeyValue(await res.text());
      const out = document.getElementById('newKey');
      if (data.ok === 'true') {
        out.innerHTML = `Generated: <code>${data.key}</code>`;
        document.getElementById('licenseKey').value = data.key;
      } else {
        out.textContent = data.error || 'Error';
      }
    }

    async function activateKey() {
      const key = document.getElementById('licenseKey').value;
      const res = await fetch('/api/license/activate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8', 'Authorization': `Bearer ${document.getElementById('adminToken').value || ''}` },
        body: toForm({ key })
      });
      const data = parseKeyValue(await res.text());
      document.getElementById('activation').innerHTML = data.ok === 'true'
        ? '<span class="status-ok">Activation successful</span>'
        : '<span class="status-err">Activation failed</span>';
      await refreshStatus();
    }

    refreshStatus();
    refreshMetrics();
    refreshAlertsAndSchema();
  </script>
</body>
</html>
