name: Document plan benchmarks
on:
  workflow_dispatch:
  push:
    branches: ['release/benchmark-documents/**']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
      SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE }}
      SPP_TEST_NATIVE_DOCUMENTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare real PDF dependencies
        run: |
          test -n "$SIXLABORS_LICENSE"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils fonts-dejavu-core
      - name: Build release and run complete tests
        run: |
          dotnet build -c Release
          dotnet test Tests/LightningSPP.Tests/LightningSPP.Tests.csproj -c Release --logger 'trx;LogFileName=baseline.trx'
      - name: Compare three activated test licenses on identical documents
        env:
          SPP_RUN_PLAN_BENCHMARKS: '1'
          SPP_PLAN_BENCHMARK_OUTPUT: ${{ github.workspace }}/artifacts/plan-benchmarks
          XDG_CONFIG_HOME: ${{ runner.temp }}/spp-plan-benchmark-config
        run: |
          mkdir -p artifacts/plan-benchmarks
          dotnet --info > artifacts/plan-benchmarks/environment.txt
          lscpu >> artifacts/plan-benchmarks/environment.txt
          free -m >> artifacts/plan-benchmarks/environment.txt
          dotnet test Tests/LightningSPP.Tests/LightningSPP.Tests.csproj -c Release --no-build --filter FullyQualifiedName~PlanDocumentBenchmarkTests --logger 'trx;LogFileName=plan-benchmarks.trx'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-plan-benchmarks-${{ github.sha }}
          path: |
            artifacts/plan-benchmarks/
            Tests/LightningSPP.Tests/TestResults/*.trx
          if-no-files-found: error
