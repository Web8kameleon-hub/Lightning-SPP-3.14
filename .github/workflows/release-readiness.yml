name: Release readiness

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'controlled/**'
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Code, tests, docs and customer UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure private Six Labors license
        env:
          SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
        run: |
          test -n "$SIXLABORS_LICENSE"
          umask 077
          printf '%s' "$SIXLABORS_LICENSE" > "$RUNNER_TEMP/sixlabors.lic"
          echo "SixLaborsLicenseFile=$RUNNER_TEMP/sixlabors.lic" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore application
        run: dotnet restore wwwmmm.csproj
      - name: Restore tests
        run: dotnet restore Tests/LightningSPP.Tests/LightningSPP.Tests.csproj
      - name: Build release
        run: dotnet build wwwmmm.csproj -c Release --no-restore
      - name: Run complete test suite
        run: dotnet test Tests/LightningSPP.Tests/LightningSPP.Tests.csproj -c Release --logger "trx;LogFileName=release-readiness.trx"
      - name: Run real pipeline smoke
        run: dotnet run --project wwwmmm.csproj -c Release --no-build -- test
      - name: Run performance gates
        run: dotnet test Tests/LightningSPP.Tests/LightningSPP.Tests.csproj -c Release --no-build --filter FullyQualifiedName~PerformanceGateTests
      - name: Validate release companions
        shell: bash
        run: |
          test -s Docs/BENCHMARK_PROTOCOL.md
          test -s Docs/EDGE_CASES_AND_NEGATIVE_TESTS.md
          test -s Docs/RELEASE_EVIDENCE.md
          test -s Web/wwwroot/landing.html
          test -s Web/wwwroot/pricing.html
          # Pricing moved off the landing page onto its own indexable /pricing page
          # (see "Add indexable product pages for SEO" and "Allow self-service license
          # activation without admin token"); verify the real, live Stripe checkout
          # links and current prices there instead of stale placeholder copy.
          grep -q "buy.stripe.com" Web/wwwroot/pricing.html
          grep -q "€49.99" Web/wwwroot/pricing.html
          grep -q "Counter-tests" Docs/EDGE_CASES_AND_NEGATIVE_TESTS.md
      - name: Block unsubstantiated customer claims
        shell: bash
        run: |
          for page in Web/wwwroot/*.html; do
            if grep -Eqi "4x faster than Adobe|50% cheaper than Google" "$page"; then
              echo "Comparative claim in $page requires an external benchmark protocol"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-readiness-results
          path: Tests/LightningSPP.Tests/TestResults/
          if-no-files-found: warn
