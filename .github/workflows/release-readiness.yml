name: Release readiness

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'controlled/**'
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
  SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE }}

jobs:
  evidence:
    name: Code, tests, docs and customer UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure private Six Labors license
        env:
          SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
        run: |
          test -n "$SIXLABORS_LICENSE"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore application
        run: dotnet restore wwwmmm.csproj
      - name: Restore tests
        run: dotnet restore Tests/LightningSPP.Tests/LightningSPP.Tests.csproj
      - name: Build release
        run: dotnet build wwwmmm.csproj -c Release --no-restore
      - name: Run complete test suite
        run: dotnet test Tests/LightningSPP.Tests/LightningSPP.Tests.csproj -c Release --logger "trx;LogFileName=release-readiness.trx"
      - name: Run real pipeline smoke
        run: dotnet run --project wwwmmm.csproj -c Release --no-build -- test
      - name: Run performance gates
        run: dotnet test Tests/LightningSPP.Tests/LightningSPP.Tests.csproj -c Release --no-build --filter FullyQualifiedName~PerformanceGateTests
      - name: Validate release companions
        run: python3 Scripts/validate-release-companions.py
      - name: Block unsubstantiated customer claims
        shell: bash
        run: |
          for page in Web/wwwroot/*.html; do
            if grep -Eqi "4x faster than Adobe|50% cheaper than Google" "$page"; then
              echo "Comparative claim in $page requires an external benchmark protocol"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-readiness-results
          path: Tests/LightningSPP.Tests/TestResults/
          if-no-files-found: warn
