name: Release readiness

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'controlled/**'
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Code, tests, docs and customer UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore application
        run: dotnet restore wwwmmm.csproj
      - name: Restore tests
        run: dotnet restore Tests/LightningSPP.Tests/LightningSPP.Tests.csproj
      - name: Build release
        run: dotnet build wwwmmm.csproj -c Release --no-restore
      - name: Run complete test suite
        run: dotnet test Tests/LightningSPP.Tests/LightningSPP.Tests.csproj -c Release --logger "trx;LogFileName=release-readiness.trx"
      - name: Run real pipeline smoke
        run: dotnet run --project wwwmmm.csproj -c Release --no-build -- test
      - name: Run performance gates
        run: dotnet test Tests/LightningSPP.Tests/LightningSPP.Tests.csproj -c Release --no-build --filter FullyQualifiedName~PerformanceGateTests
      - name: Validate release companions
        shell: bash
        run: |
          test -s Docs/BENCHMARK_PROTOCOL.md
          test -s Docs/EDGE_CASES_AND_NEGATIVE_TESTS.md
          test -s Docs/RELEASE_EVIDENCE.md
          test -s Web/wwwroot/landing.html
          grep -q "Buy with Stripe" Web/wwwroot/landing.html
          grep -q "€99.99/year" Web/wwwroot/landing.html
          grep -q "Counter-tests" Docs/EDGE_CASES_AND_NEGATIVE_TESTS.md
      - name: Block unsubstantiated customer claims
        shell: bash
        run: |
          if grep -Eqi "4x faster than Adobe|50% cheaper than Google" Web/wwwroot/landing.html; then
            echo "Comparative claim requires an external benchmark protocol"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-readiness-results
          path: Tests/LightningSPP.Tests/TestResults/
          if-no-files-found: warn
