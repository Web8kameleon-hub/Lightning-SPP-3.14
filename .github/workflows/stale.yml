name: Mark stale issues and PRs

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue has been inactive for 30 days. It will be closed in 7 days if no activity occurs.'
          stale-pr-message: 'This PR has been inactive for 30 days. It will be closed in 7 days if no activity occurs.'
          close-issue-message: 'Closing due to inactivity. Feel free to reopen with fresh context.'
          close-pr-message: 'Closing due to inactivity. Feel free to reopen when ready.'
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: security,pinned,help-wanted,good-first-issue
          exempt-pr-labels: security,pinned
