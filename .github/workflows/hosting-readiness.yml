name: Production Hosting Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - 'Dockerfile'
      - '.dockerignore'
      - '.env.production.example'
      - 'docker-compose.production.yml'
      - 'deploy/**'
      - '.github/workflows/hosting-readiness.yml'
  push:
    branches: [main]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - 'Dockerfile'
      - '.dockerignore'
      - '.env.production.example'
      - 'docker-compose.production.yml'
      - 'deploy/**'
      - '.github/workflows/hosting-readiness.yml'

permissions:
  contents: read

concurrency:
  group: hosting-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
  SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE }}

jobs:
  application:
    name: Application & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure private Six Labors license
        env:
          SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
        run: |
          test -n "$SIXLABORS_LICENSE"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: find deploy -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Install native PDF test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils fonts-dejavu-core
      - name: Run required tests
        env:
          SPP_TEST_NATIVE_DOCUMENTS: '1'
          SPP_BRIDGE_TEST_ALLOW_WRITES: ''
        run: dotnet test ./Tests/LightningSPP.Tests/LightningSPP.Tests.csproj --configuration Release --logger "trx;LogFileName=hosting-readiness.trx" --filter "FullyQualifiedName!~BridgeUpstreamTests"
      - name: Require 100 percent test execution and pass rate
        run: python3 Scripts/require-all-tests-pass.py

  container:
    name: Container & Compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: application
    steps:
      - uses: actions/checkout@v4
      - name: Configure private Six Labors license
        env:
          SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
        run: |
          test -n "$SIXLABORS_LICENSE"
      - run: cp .env.production.example .env.production
      - run: docker compose -f docker-compose.production.yml config --quiet
      - run: docker build --secret "id=sixlabors_license,env=SIXLABORS_LICENSE" -t lightning-spp:${{ github.sha }} .
      - run: docker run --rm lightning-spp:${{ github.sha }} --help
      - run: docker run --rm lightning-spp:${{ github.sha }} test
      - run: docker run --rm lightning-spp:${{ github.sha }} real
