name: Lightning SPP CI/CD

on:
  push:
    branches: [ main, develop, deploy/production ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      publish_ghcr:
        description: Publish the validated linux/amd64 image to GHCR without deploying
        type: boolean
        default: false
      deploy_production:
        description: Explicitly deploy current main after all validation gates (including sensitive changes)
        type: boolean
        default: false

permissions:
  contents: read

env:
  SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
  SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE }}
  DOTNET_VERSION: '10.0.x'
  DOCKER_IMAGE_NAME: lightning-spp

jobs:
  select-production:
    name: Select production deployment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      deploy: ${{ steps.select.outputs.deploy }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Test deployment selection policy
      run: python3 Scripts/test-select-production-deploy.py
    - name: Select against last successful production deployment
      id: select
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 Scripts/select-production-deploy.py

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Configure private Six Labors license
      env:
        SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
      run: |
        test -n "$SIXLABORS_LICENSE"

    - name: Setup Java for real Longo tests
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Validate restricted deployment entrypoint
      run: |
        bash -n deploy/production/ci-entrypoint.sh
        if SSH_ORIGINAL_COMMAND='deploy invalid' bash deploy/production/ci-entrypoint.sh; then
          echo "Restricted deployment entrypoint accepted an invalid commit." >&2
          exit 1
        fi

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Run unit tests
      env:
        # Aktivizon Poppler për testet PDF (sepse CI e instalon)
        SPP_TEST_NATIVE_DOCUMENTS: '1'
        # Shërbimet e jashtme (Excel/NodeDB) mbeten të anashkaluara në CI
        SPP_BRIDGE_TEST_ALLOW_WRITES: ''
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends poppler-utils fonts-dejavu-core
        dotnet test ./Tests/LightningSPP.Tests/LightningSPP.Tests.csproj --configuration Release --verbosity normal --logger "trx;LogFileName=ci-tests.trx" --filter "FullyQualifiedName!~BridgeUpstreamTests" --filter "FullyQualifiedName!~BridgeUpstreamTests"

    - name: Require 100 percent test execution and pass rate
      run: python3 Scripts/require-all-tests-pass.py

    - name: Run Lightning SPP Demo
      run: dotnet run --no-build --configuration Release -- demo

    - name: Run Lightning SPP Tests
      run: dotnet run --no-build --configuration Release -- test

    - name: Run Speed Benchmark
      run: |
        mkdir -p artifacts
        dotnet --info > artifacts/benchmark-environment.txt
        git rev-parse HEAD >> artifacts/benchmark-environment.txt
        date -u >> artifacts/benchmark-environment.txt
        uname -a >> artifacts/benchmark-environment.txt
        lscpu >> artifacts/benchmark-environment.txt
        free -m >> artifacts/benchmark-environment.txt
        echo 'Speed CLI: 1024 zero-filled bytes; 0 warm-up runs; 1 measured run per mode. Raw observations, not median/p95/p99 or throughput claims. Regression gates run in the test suite.' >> artifacts/benchmark-environment.txt
        dotnet run --no-build --configuration Release -- speed | tee artifacts/speed-benchmark.txt

    - name: Write failure-safe CI evidence manifest
      if: always()
      shell: bash
      run: |
        mkdir -p artifacts
        {
          printf 'commit=%s\n' "$GITHUB_SHA"
          printf 'job_status=%s\n' "${{ job.status }}"
          printf 'test_reports_found='
          find Tests/LightningSPP.Tests/TestResults -type f -name '*.trx' 2>/dev/null | wc -l
          for file in artifacts/benchmark-environment.txt artifacts/speed-benchmark.txt; do
            if test -s "$file"; then
              printf '%s=PRESENT\n' "$file"
            else
              printf '%s=NOT_PRODUCED\n' "$file"
            fi
          done
        } > artifacts/ci-evidence-status.txt
        cat artifacts/ci-evidence-status.txt

    - name: Preserve test and benchmark evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: validation-${{ github.sha }}
        path: |
          artifacts/ci-evidence-status.txt
          Tests/LightningSPP.Tests/TestResults/**/*.trx
          artifacts/benchmark-environment.txt
          artifacts/speed-benchmark.txt
        if-no-files-found: error

  docker-build:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Configure private Six Labors license
      env:
        SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
      run: |
        test -n "$SIXLABORS_LICENSE"

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build --secret "id=sixlabors_license,env=SIXLABORS_LICENSE" \
          -t ${{ env.DOCKER_IMAGE_NAME }}:latest -t ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} \
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
          --label org.opencontainers.image.revision=${{ github.sha }} .

    - name: Test hosted pages and API
      run: bash Scripts/hosting-smoke.sh ${{ env.DOCKER_IMAGE_NAME }}:latest

    - name: Test Docker container - Help
      run: docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:latest --help

    - name: Test Docker container - Demo
      run: docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:latest demo

    - name: Test Docker container - Tests
      run: docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:latest test

    - name: Test Docker container - Speed
      run: docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:latest speed

    - name: Test Docker container - REAL mode
      run: docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:latest real

    - name: Counter-test - REAL validation must fail on read-only storage
      run: |
        if docker run --rm --read-only ${{ env.DOCKER_IMAGE_NAME }}:latest real; then
          echo "REAL validation incorrectly succeeded without writable fixture/output storage." >&2
          exit 1
        fi

    - name: Export the tested image for publication
      if: github.event_name == 'workflow_dispatch' && inputs.publish_ghcr
      run: |
        mkdir -p artifacts
        docker save ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} | gzip > artifacts/docker-validated.tar.gz

    - name: Preserve the tested image
      if: github.event_name == 'workflow_dispatch' && inputs.publish_ghcr
      uses: actions/upload-artifact@v4
      with:
        name: docker-validated-${{ github.sha }}
        path: artifacts/docker-validated.tar.gz
        compression-level: 0
        retention-days: 7
        if-no-files-found: error

  publish-ghcr:
    name: Publish validated Docker image to GHCR
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_ghcr && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    concurrency:
      group: lightning-spp-ghcr-publication
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: docker-validated-${{ github.sha }}
        path: artifacts
    - name: Determine registry path and package version
      id: metadata
      run: |
        owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
        version=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('wwwmmm.csproj').findtext('PropertyGroup/Version'))")
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        echo "image=ghcr.io/$owner/${{ env.DOCKER_IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish the exact tested image
      env:
        IMAGE: ${{ steps.metadata.outputs.image }}
        VERSION: ${{ steps.metadata.outputs.version }}
      run: |
        gunzip -c artifacts/docker-validated.tar.gz | docker load
        for tag in "$VERSION" "sha-${{ github.sha }}" latest; do
          docker tag ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} "$IMAGE:$tag"
          docker push "$IMAGE:$tag"
        done
    - name: Verify the registry serves the tested image
      env:
        IMAGE: ${{ steps.metadata.outputs.image }}
        VERSION: ${{ steps.metadata.outputs.version }}
      run: |
        tested=$(docker image inspect ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} --format '{{.Id}}')
        docker pull "$IMAGE:$VERSION"
        published=$(docker image inspect "$IMAGE:$VERSION" --format '{{.Id}}')
        test "$tested" = "$published"
        docker image inspect "$IMAGE:$VERSION" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"

  publish-nuget:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build]
    if: github.event_name == 'release'

    steps:
    - name: Configure private Six Labors license
      env:
        SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
      run: |
        test -n "$SIXLABORS_LICENSE"

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Release
      run: dotnet build --configuration Release --no-restore

    - name: Pack NuGet package
      run: dotnet pack --configuration Release --no-build --output ./nupkg

    - name: Publish to NuGet.org
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: dotnet nuget push ./nupkg/*.nupkg --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Upload NuGet package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ./nupkg/*.nupkg

  publish-docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build]
    if: github.event_name == 'release'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      with:
        context: .
        push: true
        secrets: |
          sixlabors_license=${{ secrets.SIXLABORS_LICENSE }}
        tags: |
          ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:3.14
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [select-production, build-and-test, docker-build]
    if: needs.select-production.outputs.deploy == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy/production') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_production && !inputs.publish_ghcr))
    concurrency:
      group: scanprocessprint-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://scanprocessprint.com

    steps:
    - name: Validate production SSH configuration
      env:
        PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      run: |
        for name in PROD_SSH_HOST PROD_SSH_USER PROD_SSH_KEY; do
          if [ -z "${!name}" ]; then
            echo "Missing required production secret: $name" >&2
            exit 1
          fi
        done
    # Builds the release container on hel-core-01 itself (deploy.sh runs
    # `docker build` from a server-side checkout), verifies it end-to-end
    # against its own network address, hot-swaps the shared nginx edge with a
    # graceful reload, re-verifies over the public domain, then drains and
    # stops the previous release. See deploy/production/README.md for the
    # one-time host bootstrap this depends on, and deploy/production/deploy.sh
    # for the rollback-on-failure behavior - the active release is never
    # touched until the replacement has proven itself.
    - name: Deploy via SSH (deploy/production/deploy.sh)
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        key: ${{ secrets.PROD_SSH_KEY }}
        command_timeout: 15m
        script: |
          deploy ${{ github.sha }}

    - name: Post-deploy public health verification
      run: |
        for i in $(seq 1 10); do
          if curl -fsS https://scanprocessprint.com/api/health; then
            echo "Public health check passed."
            exit 0
          fi
          sleep 3
        done
        echo "Post-deploy public health check failed after deploy.sh reported success." >&2
        exit 1