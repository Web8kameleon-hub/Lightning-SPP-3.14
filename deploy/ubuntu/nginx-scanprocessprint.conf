limit_req_zone $binary_remote_addr zone=lightning_api:10m rate=10r/s;

upstream lightning_backend {
    include /etc/nginx/snippets/lightning-active-upstream.conf;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name scanprocessprint.solutions www.scanprocessprint.solutions;
    return 308 https://scanprocessprint.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name scanprocessprint.com www.scanprocessprint.com;

    include /etc/nginx/snippets/lightning-security-headers.conf;

    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /api/stripe/webhook {
        limit_req zone=lightning_api burst=30 nodelay;
        proxy_pass http://lightning_backend;
        include /etc/nginx/snippets/lightning-proxy.conf;
    }

    location /api/ {
        limit_req zone=lightning_api burst=20 nodelay;
        proxy_pass http://lightning_backend;
        include /etc/nginx/snippets/lightning-proxy.conf;
    }

    location / {
        proxy_pass http://lightning_backend;
        include /etc/nginx/snippets/lightning-proxy.conf;
    }
}
