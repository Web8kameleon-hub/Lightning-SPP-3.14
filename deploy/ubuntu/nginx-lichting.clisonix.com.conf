# Install only after valid certificates exist for this domain.
limit_req_zone $binary_remote_addr zone=lightning_api:10m rate=5r/s;
server {
    listen 80;
    server_name scanprocessprint.com www.scanprocessprint.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name scanprocessprint.com www.scanprocessprint.com;
    ssl_certificate /etc/letsencrypt/live/scanprocessprint.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scanprocessprint.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    client_body_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    location / {
        limit_req zone=lightning_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:11400;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
