server {
    listen 80;
    server_name lichting.clisonix.com;

    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        include /etc/nginx/snippets/lightning-proxy.conf;
        include /etc/nginx/snippets/lightning-security-headers.conf;
        proxy_pass http://127.0.0.1:11400;
    }
}
