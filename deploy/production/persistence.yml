name: scanprocessprint-state
services:
  longo:
    image: scanprocessprint-longo:${LONGO_RELEASE_ID:?Set LONGO_RELEASE_ID}
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    volumes:
      - /opt/scanprocessprint/longo:/data:z
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    environment:
      JAVA_TOOL_OPTIONS: '-Xmx256m'
    healthcheck:
      test: [CMD, java, -cp, /app/longo.jar, com.clisonix.longo.HealthProbe]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [state]
networks:
  state:
    name: scanprocessprint_state
    internal: true
