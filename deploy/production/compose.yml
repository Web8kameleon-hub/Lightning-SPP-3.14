name: scanprocessprint-${RELEASE_ID:?Set RELEASE_ID}
services:
  app:
    image: scanprocessprint:${RELEASE_ID}
    hostname: ${LICENSE_HOSTNAME:?Preserve hostname of the active license container}
    command: [serve, '8080']
    restart: unless-stopped
    env_file: /opt/scanprocessprint/.env.production
    environment:
      XDG_CONFIG_HOME: /home/app/.config
      LONGO_URL: http://longo:8030
      LSPP_CUSTOMER_ACCOUNTS_ENABLED: 'true'
      LSPP_NOTIFY_WORKER_ENABLED: 'true'
      LSPP_TRUSTED_PROXY_IPS: ${LSPP_TRUSTED_PROXY_IPS:?Set the current edge container IP}
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - /opt/scanprocessprint/data:/home/app/.config/LightningSPP:z
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test: [CMD, curl, -fsS, 'http://127.0.0.1:8080/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      edge:
        aliases: ["scanprocessprint-${RELEASE_ID}"]
      state:
networks:
  edge:
    external: true
    name: neurosonic_default
  state:
    external: true
    name: scanprocessprint_state
