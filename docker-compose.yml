version: '3.9'

services:
  lightning-spp:
    build:
      context: .
      dockerfile: Dockerfile
    image: lightning-spp:latest
    container_name: lightning-spp
    restart: unless-stopped
    environment:
      DOTNET_RUNNING_IN_CONTAINER: "true"
      # Optional admin token for license management endpoints.
      # LSPP_ADMIN_TOKEN: "${LSPP_ADMIN_TOKEN:-}"
    ports:
      - "13080:13080"
    command: ["serve", "13080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:13080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
